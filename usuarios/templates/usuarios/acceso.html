<!DOCTYPE html>
<html>
<head><title>Acceso</title></head>
<body>
<!-- Abre la etiqueta especificando que el método de envío es POST -->
<form method="POST">
    <!-- El token de seguridad obligatorio de Django -->
    {% csrf_token %}
    
    <!-- Imprime tus campos de Nombre de usuario y Contraseña -->
    {{ formulario.as_p }}
    
    <!-- El botón que dispara la acción de enviar -->
    <button type="submit">Iniciar sesión</button>
</form>

</body>
</html>
